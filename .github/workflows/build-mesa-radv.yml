name: Build Mesa RADV for VanGogh

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build RADV for Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            meson \
            ninja-build \
            pkg-config \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            libexpat1-dev \
            libdrm-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxshmfence-dev \
            libxxf86vm-dev \
            libwayland-dev \
            wayland-protocols \
            libclang-dev \
            llvm-dev \
            libclc-19-dev \
            libegl1-mesa-dev \
            flex \
            bison \
            libxrandr-dev \
            zlib1g-dev \
            libzstd-dev \
            libvulkan-dev \
            libxnvctrl-dev
      
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true
        id: setup-ndk
      
      - name: Create cross-compilation file
        run: |
          cat > android-cross.txt << EOF
          [binaries]
          c = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang'
          cpp = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++'
          ar = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = 'pkg-config'
          
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Clone Mesa repository
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa
          # Optional: Checkout eine stabile Version, falls die neueste problematisch ist
          # git checkout 23.3.0
      
      - name: Configure Mesa build
        working-directory: mesa
        run: |
          # Zuerst die verfügbaren Optionen prüfen
          meson setup --help > meson_options.txt || true
          echo "Verfügbare Meson-Optionen:" 
          cat meson_options.txt || true
          
          # Mesa-spezifische Optionen anzeigen
          meson configure > mesa_options.txt || true
          echo "Mesa Build-Optionen:" 
          cat mesa_options.txt || true
          
          # Build mit korrigierten Optionen
          meson setup build/ \
            --buildtype=release \
            --prefix=/usr \
            -Dplatforms=android \
            -Dgallium-drivers= \
            -Dvulkan-drivers=amd \
            -Dandroid-stub=true \
            -Dllvm=enabled \
            -Dlibdir=lib \
            -Dcpp_std=c++17 \
            --cross-file ../android-cross.txt
      
      - name: Build Mesa
        working-directory: mesa
        run: ninja -C build/
      
      - name: Create output directory
        run: mkdir -p mesa-radv-vangogh
      
      - name: Copy artifacts
        run: |
          cp -r mesa/build/src/amd/vulkan/libvulkan_radeon.so mesa-radv-vangogh/ || echo "Warning: libvulkan_radeon.so not found"
          # Überprüfen des tatsächlichen Pfads für neue Mesa-Versionen
          find mesa/build -name "libvulkan_radeon.so" -exec cp {} mesa-radv-vangogh/ \; || true
          find mesa/build -name "libvulkan.so" -exec cp {} mesa-radv-vangogh/ \; || true
          find mesa/build -name "libVkLayer_*.so" -exec cp {} mesa-radv-vangogh/ \; || true
      
      - name: Create artifact manifest
        run: |
          echo "Mesa RADV Driver for VanGogh" > mesa-radv-vangogh/README.txt
          echo "Built for VanGogh and VanGogh Lite GPUs (RDNA2 architecture)" >> mesa-radv-vangogh/README.txt
          echo "Architecture: gfx10_3" >> mesa-radv-vangogh/README.txt
          echo "Android target: aarch64" >> mesa-radv-vangogh/README.txt
          date >> mesa-radv-vangogh/README.txt
          
          # Hinzufügen von Build-Informationen
          echo -e "\nBuild Options Used:" >> mesa-radv-vangogh/README.txt
          echo "- Vulkan Drivers: amd" >> mesa-radv-vangogh/README.txt
          echo "- Platform: android" >> mesa-radv-vangogh/README.txt
          echo "- Target CPU: aarch64" >> mesa-radv-vangogh/README.txt
          
          # Auflistung der erstellten Dateien
          echo -e "\nIncluded Files:" >> mesa-radv-vangogh/README.txt
          ls -la mesa-radv-vangogh/ >> mesa-radv-vangogh/README.txt
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-radv-vangogh
          path: mesa-radv-vangogh
