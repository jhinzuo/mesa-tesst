name: Build Mesa RADV for VanGogh

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build RADV for Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            meson \
            ninja-build \
            pkg-config \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            libexpat1-dev \
            libdrm-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxshmfence-dev \
            libxxf86vm-dev \
            libwayland-dev \
            wayland-protocols \
            libclang-dev \
            llvm-dev \
            libclc-19-dev \
            libegl1-mesa-dev \
            flex \
            bison \
            libxrandr-dev \
            zlib1g-dev \
            libzstd-dev \
            libvulkan-dev \
            libxnvctrl-dev
      
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true
        id: setup-ndk
      
      - name: Create cross-compilation file
        run: |
          cat > android-cross.txt << EOF
          [binaries]
          c = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang'
          cpp = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++'
          ar = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = 'pkg-config'
          
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Clone Mesa repository
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa
      
      - name: Configure Mesa build
        working-directory: mesa
        run: |
          meson build/ \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dgallium-drivers= \
            -Dvulkan-drivers=amd \
            -Dandroid-stub=true \
            -Dllvm=enabled \
            -Dlibdir=lib \
            -Dradv-llvm=true \
            -Dinstall-dev=true \
            -Damd-arch=gfx10_3 \
            -Dradv-deep-bound-check=true \
            -Dvulkan-device-select-layer=true \
            -Damdgpu-backend=true \
            -Dvideo-codecs=h264dec,h264enc,h265dec,h265enc \
            -Dvulkan-overlay-layer=true \
            -Dradv-perftest=transfer,shaders,image_checker \
            -Dbuild-aco-tests=true \
            -Dcross-file=../android-cross.txt
      
      - name: Build Mesa
        working-directory: mesa
        run: ninja -C build/
      
      - name: Create output directory
        run: mkdir -p mesa-radv-vangogh
      
      - name: Copy artifacts
        run: |
          cp -r mesa/build/src/amd/vulkan/libvulkan_radeon.so mesa-radv-vangogh/
          cp -r mesa/build/src/vulkan/libvulkan.so mesa-radv-vangogh/
          cp -r mesa/build/src/vulkan/layers/libVkLayer_*.so mesa-radv-vangogh/ || true
      
      - name: Create artifact manifest
        run: |
          echo "Mesa RADV Driver for VanGogh" > mesa-radv-vangogh/README.txt
          echo "Built for VanGogh and VanGogh Lite GPUs (RDNA2 architecture)" >> mesa-radv-vangogh/README.txt
          echo "Architecture: gfx10_3" >> mesa-radv-vangogh/README.txt
          echo "Android target: aarch64" >> mesa-radv-vangogh/README.txt
          date >> mesa-radv-vangogh/README.txt
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-radv-vangogh
          path: mesa-radv-vangogh
